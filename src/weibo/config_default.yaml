setting:
    checkRate: 60  # 聚合推送检查间隔(秒)
    imagesCache: log/aggregator  # 图片缓存目录
    debugCeobeAPI: false  # 调试开关，开启后会输出详细的API调用信息
    # 聚合推送配置
    enableAggregator: true  # 启用聚合推送功能
    maxImagesPerPost: 9  # 每条内容最多发送的图片数量
    contentPreviewLength: 0  # 内容预览长度（0表示不限制长度，全部发送）
    sendGIF: true  # 是否发送GIF动图
    mergeImages: false  # 是否启用图片拼接功能
    mergeTolerance: 5.0  # 图片拼接尺寸容忍度（百分比）

sendInterval: 0.5  # 发送间隔
sendAsync: false   # 是否异步发送

block: [ ]  # 内容屏蔽正则表达式列表

# 聚合推送配置
aggregator:
    subscriptionFile: "aggregator_subscriptions.json"  # 订阅配置文件
    supportedPlatforms:  # 支持的平台
        - weibo
        - bilibili
        - netease-cloud-music
        - arknights-game
        - arknights-website
